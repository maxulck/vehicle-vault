image: node:20

stages:
  - build

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store

before_script:
  - corepack enable
  - corepack prepare pnpm@10.24.0 --activate
  - pnpm config set store-dir .pnpm-store
  - pnpm install --no-frozen-lockfile

build:
  stage: build
  script:
    - pnpm build
